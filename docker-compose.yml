version: '3.8'

services:
  fraudlens-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudlens-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/fraudlens.db
      - JWT_SECRET_KEY=fraudlens-jwt-secret-key-change-in-production-use-strong-entropy
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - FRONTEND_DIR=/app/frontend
    volumes:
      # SQLite database persistent storage
      - ./fraudlens-backend/fraudlens.db:/app/fraudlens.db
      # ML models persistent storage
      - ./fraudlens-backend/models:/app/models
      - ./fraudlens-backend/app/ml/ml/models:/app/app/ml/ml/models
      # Reference datasets
      - ./fraudlens-backend/datasets:/app/datasets
      # Temporary uploads and generated audit reports
      - ./fraudlens-backend/temp_uploads:/app/temp_uploads
      - ./fraudlens-backend/generated_reports:/app/generated_reports
      # Frontend static files mount
      - ./index.html:/app/frontend/index.html:ro
      - ./css:/app/frontend/css:ro
      - ./js:/app/frontend/js:ro
